<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Color Dash</title>
<style>
:root{color-scheme:dark;--bg:#090d1d;--panel:#121a32;--cyan:#58f0ff;--pink:#ff4f9a;--gold:#ffd166}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#182449 0%,#090d1d 65%)}
#wrap{position:relative;width:min(100vw,520px);height:min(100vh,900px);height:min(100dvh,900px);min-height:480px;overflow:hidden;background:linear-gradient(180deg,#111a37,#080b19);border:1px solid #26345d}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0 0 auto;padding:18px 18px 0;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 12px #000}
.stat{font-size:12px;letter-spacing:2px;color:#aebee8}.num{font-size:26px;font-weight:900;letter-spacing:0;color:white}
#hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#aebee8;font-size:12px;letter-spacing:1px;pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#070a16bb;backdrop-filter:blur(6px)}
.card{width:100%;max-width:360px;text-align:center;padding:30px 22px;border:1px solid #33456f;border-radius:24px;background:linear-gradient(145deg,#182345f5,#0b1024f5);box-shadow:0 20px 70px #0008}
.kicker{font-size:11px;letter-spacing:4px;color:var(--cyan);font-weight:800}
h1{font-size:clamp(38px,10vw,56px);line-height:.95;margin:12px 0 14px;font-weight:1000;letter-spacing:-2px}
h1 span{color:var(--cyan)}p{color:#b7c4e8;line-height:1.55;font-size:14px}
button{border:0;border-radius:14px;padding:15px 22px;width:100%;margin-top:12px;background:linear-gradient(90deg,#58f0ff,#8e8cff);color:#071020;font-size:15px;font-weight:900;letter-spacing:1px;cursor:pointer;box-shadow:0 8px 28px #58f0ff35}
button:active{transform:scale(.98)}.small{font-size:11px;color:#8494c1;margin-top:18px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" aria-label="Color Dash game"></canvas>
<div id="hud"><div><div class="stat">SCORE</div><div class="num" id="score">0</div></div><div style="text-align:right"><div class="stat">BEST</div><div class="num" id="best">0</div></div></div>
<div id="hint">TAP LEFT OR RIGHT TO DODGE</div>
<div id="overlay"><div class="card"><div class="kicker">A TINY ARCADE CHALLENGE</div><h1>COLOR<br><span>DASH</span></h1><p>Dodge the pink blocks. Collect golden sparks. Survive as long as you can and beat your best score.</p><button id="start">PLAY NOW</button><div class="small">FREE TO PLAY · NO DOWNLOAD NEEDED</div></div></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
let W=360,H=640,dpr=1,playing=false,score=0,best=0,last=0,spawn=0,coinSpawn=0,speed=210,playerLane=1,playerY=0,obstacles=[],coins=[],particles=[],stars=[],survivalRemainder=0;
try{best=Number(localStorage.getItem('colordash-best')||0)}catch(e){}bestEl.textContent=best;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);playerY=H*.79;stars=Array.from({length:55},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.4,a:Math.random()*.6+.15}));}
window.addEventListener('resize',resize);resize();
function laneX(l){return W*(.2+l*.3)}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function reset(){score=0;survivalRemainder=0;speed=210;spawn=.6;coinSpawn=1.5;obstacles=[];coins=[];particles=[];playerLane=1;playing=true;last=performance.now();scoreEl.textContent='0';overlay.classList.add('hidden');document.getElementById('hint').textContent='TAP LEFT OR RIGHT TO DODGE';}
function end(){playing=false;best=Math.max(best,score);bestEl.textContent=best;try{localStorage.setItem('colordash-best',best)}catch(e){}overlay.innerHTML=`<div class="card"><div class="kicker">RUN COMPLETE</div><h1>GAME<br><span>OVER</span></h1><p>You scored <strong style="color:#fff">${score}</strong> points.<br>Your best is <strong style="color:#58f0ff">${best}</strong>.</p><button id="again">TRY AGAIN</button><div class="small">ONE MORE RUN? YOU'VE GOT THIS.</div></div>`;overlay.classList.remove('hidden');document.getElementById('again').addEventListener('click',reset);}
function move(dir){if(!playing)return;playerLane=Math.max(0,Math.min(2,playerLane+dir));}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();move(e.clientX-r.left<r.width/2?-1:1)});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if((e.key===' '||e.key==='Enter')&&!playing)reset()});
startBtn.addEventListener('click',reset);
function burst(x,y,color){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.5,color})}
function update(dt){if(!playing)return;survivalRemainder+=dt*10;const earned=Math.floor(survivalRemainder);if(earned>0){score+=earned;survivalRemainder-=earned;}speed=210+Math.min(score*1.4,230);scoreEl.textContent=score;
spawn-=dt;if(spawn<=0){obstacles.push({lane:Math.floor(Math.random()*3),y:-40,size:24+Math.random()*10});spawn=Math.max(.34,1.0-score*.002)+Math.random()*.28}
coinSpawn-=dt;if(coinSpawn<=0){coins.push({lane:Math.floor(Math.random()*3),y:-20,r:8});coinSpawn=1.4+Math.random()*1.3}
for(const o of obstacles)o.y+=speed*dt;for(const c of coins)c.y+=speed*dt;
const px=laneX(playerLane),py=playerY;
for(const o of obstacles){if(o.lane===playerLane&&Math.abs(o.y-py)<27){burst(px,py,'#ff4f9a');end();return}}
obstacles=obstacles.filter(o=>o.y<H+60);
coins=coins.filter(c=>{if(c.lane===playerLane&&Math.abs(c.y-py)<27){score+=25;scoreEl.textContent=score;burst(laneX(c.lane),c.y,'#ffd166');return false}return c.y<H+30});
particles=particles.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;return p.life>0});
}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#111a37');g.addColorStop(1,'#080b19');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#b9d7ff';ctx.fillRect(s.x,s.y,s.s,s.s)}ctx.globalAlpha=1;
ctx.strokeStyle='#253458';ctx.lineWidth=1;for(let l=0;l<3;l++){ctx.beginPath();ctx.moveTo(laneX(l),0);ctx.lineTo(laneX(l),H);ctx.stroke()}
ctx.strokeStyle='#253458';ctx.setLineDash([8,12]);ctx.beginPath();ctx.moveTo(W*.35,0);ctx.lineTo(W*.35,H);ctx.moveTo(W*.65,0);ctx.lineTo(W*.65,H);ctx.stroke();ctx.setLineDash([]);
for(const o of obstacles){const x=laneX(o.lane)-15;ctx.shadowBlur=18;ctx.shadowColor='#ff4f9a';ctx.fillStyle='#ff4f9a';roundRect(x,o.y-15,30,30,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffc2dc';ctx.stroke()}
for(const c of coins){ctx.shadowBlur=18;ctx.shadowColor='#ffd166';ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(laneX(c.lane),c.y,c.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff0b0';ctx.lineWidth=2;ctx.stroke()}
const x=laneX(playerLane),y=playerY;ctx.shadowBlur=25;ctx.shadowColor='#58f0ff';ctx.fillStyle='#58f0ff';roundRect(x-15,y-15,30,30,9);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#d8fcff';ctx.lineWidth=2;roundRect(x-10,y-10,20,20,6);ctx.stroke();
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;
if(playing){const prog=Math.min(score/250,1);ctx.fillStyle='#253458';ctx.fillRect(0,H-4,W,4);ctx.fillStyle='#58f0ff';ctx.fillRect(0,H-4,W*prog,4)}
requestAnimationFrame(loop)}
function loop(t){const dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);draw()}
requestAnimationFrame(t=>{last=t;loop(t)});
})();
</script>
</body>
</html>
