<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Color Dash</title>
<style>
:root{color-scheme:dark;--bg:#090d1d;--panel:#121a32;--cyan:#58f0ff;--pink:#ff4f9a;--gold:#ffd166}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#182449 0%,#090d1d 65%)}
#wrap{position:relative;width:min(100vw,520px);height:min(100vh,900px);height:min(100dvh,900px);min-height:480px;overflow:hidden;background:linear-gradient(180deg,#111a37,#080b19);border:1px solid #26345d}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0 0 auto;padding:18px 18px 0;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 12px #000}
.stat{font-size:12px;letter-spacing:2px;color:#aebee8}.num{font-size:26px;font-weight:900;letter-spacing:0;color:white}#levelHud{text-align:center;position:absolute;top:18px;left:50%;transform:translateX(-50%);pointer-events:none;text-shadow:0 2px 12px #000}#levelNum{font-size:22px;font-weight:900;color:#58f0ff}#levelHud .stat{font-size:10px}
#hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#aebee8;font-size:12px;letter-spacing:1px;pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#070a16bb;backdrop-filter:blur(6px)}
.card{width:100%;max-width:360px;text-align:center;padding:30px 22px;border:1px solid #33456f;border-radius:24px;background:linear-gradient(145deg,#182345f5,#0b1024f5);box-shadow:0 20px 70px #0008}
.kicker{font-size:11px;letter-spacing:4px;color:var(--cyan);font-weight:800}
h1{font-size:clamp(38px,10vw,56px);line-height:.95;margin:12px 0 14px;font-weight:1000;letter-spacing:-2px}
h1 span{color:var(--cyan)}p{color:#b7c4e8;line-height:1.55;font-size:14px}
button{border:0;border-radius:14px;padding:15px 22px;width:100%;margin-top:12px;background:linear-gradient(90deg,#58f0ff,#8e8cff);color:#071020;font-size:15px;font-weight:900;letter-spacing:1px;cursor:pointer;box-shadow:0 8px 28px #58f0ff35}
button:active{transform:scale(.98)}.small{font-size:11px;color:#8494c1;margin-top:18px}
.menu-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.menu-buttons button{margin-top:10px}
button.secondary{background:linear-gradient(135deg,#25365f,#172443);color:#dce8ff;border:1px solid #405681;box-shadow:none}
button.tertiary{background:transparent;color:#aebee8;border:1px solid #33456f;box-shadow:none}
.card{animation:cardIn .28s ease-out}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.menu-mark{display:flex;justify-content:center;gap:7px;margin:0 auto 18px}
.menu-mark span{display:block;width:9px;height:27px;border-radius:8px;box-shadow:0 0 16px currentColor}
.menu-mark span:nth-child(1){color:#58f0ff;background:#58f0ff}
.menu-mark span:nth-child(2){color:#ff4f9a;background:#ff4f9a;transform:translateY(-5px)}
.menu-mark span:nth-child(3){color:#ffd166;background:#ffd166}
.menu-feature{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:15px}
.menu-feature span{font-size:10px;letter-spacing:.5px;color:#c8d5f5;border:1px solid #34466e;background:#111b35;padding:6px 9px;border-radius:999px}
.option-row{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:12px 0;border-bottom:1px solid #2a385c;color:#dce5ff;font-size:13px}
.option-row button{width:auto;min-width:92px;margin:0;padding:10px 12px;font-size:12px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" aria-label="Color Dash game"></canvas>
<div id="hud"><div><div class="stat">SCORE</div><div class="num" id="score">0</div></div><div style="text-align:right"><div class="stat">BEST</div><div class="num" id="best">0</div></div></div><div id="levelHud"><div class="stat">LEVEL</div><div id="levelNum">1</div></div>
<div id="hint">TAP LEFT OR RIGHT TO DODGE</div>
<div id="overlay"><div class="card">
<div class="menu-mark" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="kicker">A TINY ARCADE CHALLENGE</div><h1>COLOR<br><span>DASH</span></h1>
<p>Dodge the pink blocks. Collect golden sparks. Survive as long as you can and beat your best score.</p>
<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 8px"><span class="stat">YOUR BEST</span><strong id="menuBest" style="font-size:23px;color:#58f0ff">0</strong></div>
<button id="start">PLAY NOW</button>
<div class="menu-buttons"><button class="secondary" id="howToPlay">HOW TO PLAY</button><button class="secondary" id="settings">SETTINGS</button></div>
<div class="menu-feature"><span>3 LANES</span><span>DODGE</span><span>COLLECT</span></div>
<div class="small">FREE TO PLAY · NO DOWNLOAD NEEDED</div>
</div></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),levelEl=document.getElementById('levelNum');
let W=360,H=640,dpr=1,playing=false,score=0,best=0,last=0,spawn=0,coinSpawn=0,speed=210,playerLane=1,playerX=0,playerY=0,playerTilt=0,animTime=0,trailTimer=0,obstacles=[],coins=[],particles=[],playerTrail=[],stars=[],survivalRemainder=0;
let glowEnabled=true,level=1,lastObstacleLane=-1;
try{best=Number(localStorage.getItem('colordash-best')||0)}catch(e){}bestEl.textContent=best;
const menuBestEl=document.getElementById('menuBest');if(menuBestEl)menuBestEl.textContent=best;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);playerY=H*.79;if(!playerX)playerX=laneX(playerLane);stars=Array.from({length:55},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.4,a:Math.random()*.6+.15}));}
window.addEventListener('resize',resize);resize();
function laneX(l){return W*(.2+l*.3)}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function reset(){score=0;survivalRemainder=0;speed=210;level=1;lastObstacleLane=-1;spawn=.85;coinSpawn=1.5;obstacles=[];coins=[];particles=[];playerTrail=[];playerLane=1;playerX=laneX(1);playerTilt=0;trailTimer=0;playing=true;last=performance.now();scoreEl.textContent='0';if(levelEl)levelEl.textContent='1';overlay.classList.add('hidden');document.getElementById('hint').textContent='TAP LEFT OR RIGHT TO DODGE';}
function showMainMenu(){
 playing=false;
 overlay.innerHTML=`<div class="card">
 <div class="menu-mark" aria-hidden="true"><span></span><span></span><span></span></div>
 <div class="kicker">A TINY ARCADE CHALLENGE</div><h1>COLOR<br><span>DASH</span></h1>
 <p>Dodge the pink blocks. Collect golden sparks. Survive as long as you can and beat your best score.</p>
 <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 8px"><span class="stat">YOUR BEST</span><strong id="menuBest" style="font-size:23px;color:#58f0ff">${best}</strong></div>
 <button id="start">PLAY NOW</button>
 <div class="menu-buttons"><button class="secondary" id="howToPlay">HOW TO PLAY</button><button class="secondary" id="settings">SETTINGS</button></div>
 <div class="menu-feature"><span>3 LANES</span><span>DODGE</span><span>COLLECT</span></div>
 <div class="small">FREE TO PLAY · NO DOWNLOAD NEEDED</div></div>`;
 overlay.classList.remove('hidden');
 document.getElementById('start').addEventListener('click',reset);
 document.getElementById('howToPlay').addEventListener('click',showHowToPlay);
 document.getElementById('settings').addEventListener('click',showSettings);
}
function showHowToPlay(){
 overlay.innerHTML=`<div class="card"><div class="kicker">QUICK GUIDE</div><h1 style="font-size:38px">HOW TO<br><span>PLAY</span></h1>
 <p>Stay alive for as long as you can. Watch the lanes and react quickly.</p>
 <div class="option-row"><span>Move left</span><strong style="color:#58f0ff">← / A</strong></div>
 <div class="option-row"><span>Move right</span><strong style="color:#58f0ff">→ / D</strong></div>
 <div class="option-row"><span>Dodge</span><strong style="color:#ff4f9a">PINK BLOCKS</strong></div>
 <div class="option-row"><span>Collect</span><strong style="color:#ffd166">+25 POINTS</strong></div>
 <p class="small">On touch screens, tap the left or right half of the game area.</p>
 <button id="guidePlay">LET'S PLAY</button><button class="tertiary" id="guideBack">BACK TO MENU</button></div>`;
 overlay.classList.remove('hidden');
 document.getElementById('guidePlay').addEventListener('click',reset);
 document.getElementById('guideBack').addEventListener('click',showMainMenu);
}
function showSettings(){
 overlay.innerHTML=`<div class="card"><div class="kicker">MAKE IT YOURS</div><h1 style="font-size:38px">GAME<br><span>SETTINGS</span></h1>
 <p>Adjust the visual effects or clear your saved best score.</p>
 <div class="option-row"><span>Glow effects</span><button class="secondary" id="glowToggle">${glowEnabled?'ON':'OFF'}</button></div>
 <div class="option-row"><span>Best score</span><strong style="color:#58f0ff">${best}</strong></div>
 <button class="tertiary" id="clearBest">RESET BEST SCORE</button>
 <button id="settingsBack">BACK TO MENU</button></div>`;
 overlay.classList.remove('hidden');
 document.getElementById('glowToggle').addEventListener('click',()=>{glowEnabled=!glowEnabled;showSettings();});
 document.getElementById('clearBest').addEventListener('click',()=>{best=0;bestEl.textContent='0';try{localStorage.setItem('colordash-best','0')}catch(e){}showSettings();});
 document.getElementById('settingsBack').addEventListener('click',showMainMenu);
}
function end(){
 playing=false;best=Math.max(best,score);bestEl.textContent=best;
 try{localStorage.setItem('colordash-best',best)}catch(e){}
 overlay.innerHTML=`<div class="card"><div class="kicker">RUN COMPLETE</div><h1>GAME<br><span>OVER</span></h1>
 <p>You scored <strong style="color:#fff">${score}</strong> points.<br>Your best is <strong style="color:#58f0ff">${best}</strong>.</p>
 <button id="again">TRY AGAIN</button><button class="secondary" id="gameMenu">MAIN MENU</button>
 <div class="small">ONE MORE RUN? YOU'VE GOT THIS.</div></div>`;
 overlay.classList.remove('hidden');
 document.getElementById('again').addEventListener('click',reset);
 document.getElementById('gameMenu').addEventListener('click',showMainMenu);
}
function move(dir){if(!playing)return;playerLane=Math.max(0,Math.min(2,playerLane+dir));}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();move(e.clientX-r.left<r.width/2?-1:1)});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if((e.key===' '||e.key==='Enter')&&!playing)reset()});
startBtn.addEventListener('click',reset);
document.getElementById('howToPlay').addEventListener('click',showHowToPlay);
document.getElementById('settings').addEventListener('click',showSettings);
function burst(x,y,color){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.5,color})}
function update(dt){animTime+=dt;if(!playing)return;survivalRemainder+=dt*10;const earned=Math.floor(survivalRemainder);if(earned>0){score+=earned;survivalRemainder-=earned;}
const nextLevel=Math.min(10,1+Math.floor(score/100));if(nextLevel!==level){level=nextLevel;if(levelEl)levelEl.textContent=String(level);const hint=document.getElementById('hint');if(hint)hint.textContent='LEVEL '+level+' · KEEP MOVING!';}
speed=210+Math.min((level-1)*22,160)+Math.min(score*0.18,45);scoreEl.textContent=score;
spawn-=dt;if(spawn<=0){
 let lane=Math.floor(Math.random()*3);
 // Avoid repeating the previous lane when possible, giving players a readable escape route.
 if(lane===lastObstacleLane)lane=(lane+1+Math.floor(Math.random()*2))%3;
 lastObstacleLane=lane;obstacles.push({lane,y:-40,size:24+Math.random()*10});
 const baseGap=Math.max(.48,.92-(level-1)*.045);
 spawn=baseGap+Math.random()*.24;
}
coinSpawn-=dt;if(coinSpawn<=0){coins.push({lane:Math.floor(Math.random()*3),y:-20,r:8});coinSpawn=1.4+Math.random()*1.3}
for(const o of obstacles)o.y+=speed*dt;for(const c of coins)c.y+=speed*dt;
const targetX=laneX(playerLane),oldX=playerX;playerX+=(targetX-playerX)*(1-Math.exp(-dt*16));playerTilt=Math.max(-.28,Math.min(.28,(playerX-oldX)*-.012));const px=playerX,py=playerY;
trailTimer-=dt;if(Math.abs(targetX-playerX)>1.5&&trailTimer<=0){playerTrail.push({x:px,y:py+13,life:.28,max:.28,r:3+Math.random()*3});trailTimer=.025;}
for(const o of obstacles){if(Math.abs(laneX(o.lane)-px)<18&&Math.abs(o.y-py)<27){burst(px,py,'#ff4f9a');end();return}}
obstacles=obstacles.filter(o=>o.y<H+60);
coins=coins.filter(c=>{if(Math.abs(laneX(c.lane)-px)<19&&Math.abs(c.y-py)<27){score+=25;scoreEl.textContent=score;burst(laneX(c.lane),c.y,'#ffd166');return false}return c.y<H+30});
particles=particles.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;return p.life>0});
playerTrail=playerTrail.filter(p=>{p.life-=dt;p.y+=dt*42;return p.life>0});
}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#111a37');g.addColorStop(1,'#080b19');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#b9d7ff';ctx.fillRect(s.x,s.y,s.s,s.s)}ctx.globalAlpha=1;
ctx.strokeStyle='#253458';ctx.lineWidth=1;for(let l=0;l<3;l++){ctx.beginPath();ctx.moveTo(laneX(l),0);ctx.lineTo(laneX(l),H);ctx.stroke()}
ctx.strokeStyle='#253458';ctx.setLineDash([8,12]);ctx.beginPath();ctx.moveTo(W*.35,0);ctx.lineTo(W*.35,H);ctx.moveTo(W*.65,0);ctx.lineTo(W*.65,H);ctx.stroke();ctx.setLineDash([]);
for(const o of obstacles){const x=laneX(o.lane)-15;ctx.shadowBlur=glowEnabled?18:0;ctx.shadowColor='#ff4f9a';ctx.fillStyle='#ff4f9a';roundRect(x,o.y-15,30,30,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffc2dc';ctx.stroke()}
for(const c of coins){ctx.shadowBlur=glowEnabled?18:0;ctx.shadowColor='#ffd166';ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(laneX(c.lane),c.y,c.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff0b0';ctx.lineWidth=2;ctx.stroke()}
// Cyan movement trail fades behind the player.
for(const t of playerTrail){ctx.globalAlpha=Math.max(0,t.life/t.max)*.65;ctx.fillStyle='#58f0ff';ctx.shadowBlur=glowEnabled?12:0;ctx.shadowColor='#58f0ff';ctx.beginPath();ctx.arc(t.x,t.y,t.r*(t.life/t.max),0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;ctx.shadowBlur=0;
const x=playerX,y=playerY,pulse=1+Math.sin(animTime*7)*.045,body=15*pulse;
ctx.save();ctx.translate(x,y);ctx.rotate(playerTilt);ctx.shadowBlur=glowEnabled?27:0;ctx.shadowColor='#58f0ff';
// Short energy fins give the player a fast, futuristic silhouette.
ctx.fillStyle='#58f0ff';ctx.globalAlpha=.8;ctx.beginPath();ctx.moveTo(-body*.55,8);ctx.lineTo(-body*1.05,17+Math.sin(animTime*20)*2);ctx.lineTo(-body*.15,12);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(body*.55,8);ctx.lineTo(body*1.05,17+Math.sin(animTime*20)*2);ctx.lineTo(body*.15,12);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
const pg=ctx.createLinearGradient(-body,-body,body,body);pg.addColorStop(0,'#d9ffff');pg.addColorStop(.35,'#58f0ff');pg.addColorStop(1,'#398bff');ctx.fillStyle=pg;roundRect(-body,-body,body*2,body*2,9);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#e8ffff';ctx.lineWidth=2;roundRect(-body*.67,-body*.67,body*1.34,body*1.34,6);ctx.stroke();
ctx.fillStyle='#ffffff';ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(0,0,3.3+Math.sin(animTime*9)*.5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.restore();
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;
if(playing){const prog=Math.min(score/250,1);ctx.fillStyle='#253458';ctx.fillRect(0,H-4,W,4);ctx.fillStyle='#58f0ff';ctx.fillRect(0,H-4,W*prog,4)}
requestAnimationFrame(loop)}
function loop(t){const dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);draw()}
requestAnimationFrame(t=>{last=t;loop(t)});
})();
</script>
</body>
</html>
